name: CI

on: [push] # always will be pushed

jobs: 
  sast_scan: # security sast scanning tool
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code 
      uses: actions/checkout@v2

    - name: Set up Python #install tools what we need
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      run: bandit -ll -ii -r . -f json -o bandit-report.json # everything is scanned and output report implemented

    - name: Upload Artifact # upload the report as an artifact that it is still available after job is executed
      uses: actions/upload-artifact@v4
      if: always() # even the previous steps fails, this is executed
      with:
        name: bandit-findings
        path: bandit-report.json

  image_scan: 
    name: Build image and Run Image Scan
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Docker # docker available on our environment
      uses: docker-practice/actions-setup-docker@v1 #set up workflow with spesific version of docker
   
    - name: Build Docker Image # docker image need to be built before scanning it
      run: docker build -f Dockerfile -t vulnerableapp:latest .

    - name: Docker Scout Scan # install docker scout, quick overview of an image, scan docker image for security issues
      run: | 
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh
          sh install.scout.sh 

          echo ${{ secrets.SECURE_PASSWORD }} | docker login -u ${{ secrets.SECRET_USER }} --password-stdin
          
          docker scout quickview vulenrableapp:latest
          docker scout cves vulenrableapp:latest
    
      # log in using global variables to avoid hard coding user credentials
      
    
  
      
      
