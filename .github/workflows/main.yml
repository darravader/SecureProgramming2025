name: CI

on: [push] # always will be pushed

jobs: 
  sast_scan: # security sast scanning tool
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code 
      uses: actions/checkout@v2

    - name: Set up Python #install tools what we need
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      run: bandit -ll -ii -r . -f json -o bandit-report.json # everything is scanned and output report implemented

    - name: Upload Artifact # upload the report as an artifact that it is still available after job is executed
      uses: actions/upload-artifact@v4
      if: always() # even the previous steps fails, this is executed
      with:
        name: bandit-findings
        path: bandit-report.json

  image_scan: 
    name: Build image and Run Image Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Docker
      uses: docker/setup-buildx-action@v3.10.0

    - name: Build Docker Image
      run: docker build -f Dockerfile -t vulnerableapp:latest .

    - name: Docker Scout Quickview
      uses: docker/scout-action@v1
      with:
        command: quickview
        image: vulnerableapp:latest

    - name: Docker Scout CVEs
      uses: docker/scout-action@v1
      with:
        command: cves
        image: vulnerableapp:latest
        only-severities: critical,high
        exit-code: true

    
  
      
      
